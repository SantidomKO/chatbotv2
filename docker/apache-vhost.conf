<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    RedirectMatch 302 ^/$ /chatbotv2/
    Alias /chatbotv2/ /var/www/html/

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(?:\.git|actions|controller|data|docs|domain|model|models|scripts|tests|view)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(?:\.env(?:\..*)?|.*\.(?:sql|yml|yaml)|Dockerfile|README\.md|app_config\.php|check_user_5\.php|test_db\.php|update_password\.php)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
